# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: ci

on:
  push:
    branches: [ "main", "dev" ]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "*.md"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.15]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          activate-environment: true
          enable-cache: true
          version: "latest"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install ruff without running check or format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "--version"
      - uses: extractions/setup-just@v4  # Or: uv tool install rust-just
      - name: Setup PDM by uv
        run: |
          uv tool install pdm --with pdm-plugin-i
          pdm config check_update false
          pdm config use_uv true
      - name: Setup fast by uv
        run: uv tool install fast-dev-cli
      - name: Setup ty
        run: uv tool install ty
      - name: Pull submodule justfile
        run: just
      - name: Check code style and Type Hints
        run: just check

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13, 3.14, 3.15]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest-known"
          enable-cache: true
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Setup PDM by uv
        run: |
          uv tool install pdm
          pdm config check_update false
          pdm config use_uv true
      - name: Setup fast by uv
        run: |
          uv tool install fast-dev-cli
      - name: Pull submodule justfile
        run: uvx --from rust-just just
      - name: Test with pytest
        run: uvx --from rust-just just test
